[package]
name = "flutter-app-template"
version = "0.1.0"
authors = ["David Craven <david@craven.ch>"]
edition = "2024"
# Matches the embedder's MSRV (flutter-rs 0.5.0).
rust-version = "1.88"

[dependencies]
env_logger = "0.11"
flutter-engine = { path = "../flutter-rs/flutter-engine" }
flutter-glfw = { path = "../flutter-rs/flutter-glfw" }
log = "0.4"
# The verification harness decodes a typed-list reply into a struct.
serde = { version = "1", features = ["derive"] }

# glfw-rs 0.63 leaks windows created with `create_shared`; flutter-glfw needs
# shared contexts for its master/resource/view contexts. The vendor copy is the
# same crate with the destruction guard removed.
[patch.crates-io]
glfw = { path = "../flutter-rs/vendor/glfw" }
